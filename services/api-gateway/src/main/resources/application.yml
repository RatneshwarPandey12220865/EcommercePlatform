spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/auth/**
          - id: product-service
            uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/products/**,/api/categories/**
          - id: order-service
            uri: ${ORDER_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/orders/**
          - id: payment-service
            uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/payments/**
          # notification-service is intentionally not routed here - it is
          # only ever called service-to-service, never from the browser.

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:120}
