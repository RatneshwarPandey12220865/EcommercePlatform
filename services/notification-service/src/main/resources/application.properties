spring.application.name=notification-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_notification
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

# log = write emails to the log (default, no SMTP needed).
# smtp = send for real; also set spring.mail.* and SMTP_* env vars below.
notification.mode=${NOTIFICATION_MODE:log}
notification.from-address=${NOTIFICATION_FROM_ADDRESS:no-reply@ecommerce-platform.local}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
