spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_auth
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MIN:15}
jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
