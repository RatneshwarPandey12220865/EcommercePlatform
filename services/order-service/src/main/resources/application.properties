spring.application.name=order-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_order
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
services.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
