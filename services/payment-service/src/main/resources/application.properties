spring.application.name=payment-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_payment
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}

# Razorpay test-mode credentials. Fill these into a local .env / exported
# env vars before starting this service for real - not committed.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

services.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
