version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/services/auth-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/services/product-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/services/payment-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/services/notification-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
